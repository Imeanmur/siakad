<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Jadwal Kuliah - SIAKAD</title>
    <meta name="description" content="Kelola jadwal perkuliahan SIAKAD: mata kuliah, dosen, hari, dan jam.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fs-4 mb-0">Jadwal Perkuliahan</h2>
            <button type="button" class="btn btn-primary" id="btn-add"><i class="bi bi-plus-circle me-2"></i>Buat Jadwal</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>No</th><th>Mata Kuliah</th><th>Dosen</th><th>Hari</th><th>Waktu</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="schedules-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="schedule-form" novalidate>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="scheduleModalLabel">Form Buat Jadwal</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="id" id="j-id">
                            <div class="mb-3"><label for="j-matkul" class="form-label">Mata Kuliah</label><select class="form-select" id="j-matkul" name="matkul_id" required></select></div>
                            <div class="mb-3"><label for="j-dosen" class="form-label">Dosen Pengajar</label><select class="form-select" id="j-dosen" name="dosen_id" required></select></div>
                            <div class="mb-3"><label for="j-hari" class="form-label">Hari</label><select class="form-select" id="j-hari" name="hari" required></select></div>
                            <div class="row">
                                <div class="col-6 mb-3"><label for="j-mulai" class="form-label">Jam Mulai</label><input type="time" class="form-control" id="j-mulai" name="jam_mulai" required></div>
                                <div class="col-6 mb-3"><label for="j-selesai" class="form-label">Jam Selesai</label><input type="time" class="form-control" id="j-selesai" name="jam_selesai" required></div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary" id="schedule-submit">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body"><p class="mb-0">Yakin ingin menghapus jadwal <strong id="delete-name"></strong>?</p></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-danger" id="delete-confirm">Ya, Hapus</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/schedules.js"></script>
</body>
</html>
