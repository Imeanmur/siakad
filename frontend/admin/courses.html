<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Mata Kuliah - SIAKAD</title>
    <meta name="description" content="Kelola data mata kuliah SIAKAD: kode, nama, dan SKS.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fs-4 mb-0">Data Mata Kuliah</h2>
            <button type="button" class="btn btn-primary" id="btn-add"><i class="bi bi-plus-circle me-2"></i>Tambah Mata Kuliah</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead>
                            <tr><th>No</th><th>Kode MK</th><th>Nama Mata Kuliah</th><th>SKS</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="courses-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="course-form" novalidate>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="courseModalLabel">Form Tambah Mata Kuliah</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="id" id="c-id">
                            <div class="mb-3"><label for="c-kode" class="form-label">Kode Mata Kuliah</label><input type="text" class="form-control text-uppercase" id="c-kode" name="kode_matkul" maxlength="20" required></div>
                            <div class="mb-3"><label for="c-nama" class="form-label">Nama Mata Kuliah</label><input type="text" class="form-control" id="c-nama" name="nama_matkul" maxlength="100" required></div>
                            <div class="mb-3"><label for="c-sks" class="form-label">SKS</label><input type="number" class="form-control" id="c-sks" name="sks" min="1" max="10" required></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary" id="course-submit">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body"><p class="mb-0">Yakin ingin menghapus mata kuliah <strong id="delete-name"></strong>? Jadwal terkait akan ikut terhapus.</p></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-danger" id="delete-confirm">Ya, Hapus</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/courses.js"></script>
</body>
</html>
