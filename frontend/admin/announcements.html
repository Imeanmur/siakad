<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengumuman - SIAKAD</title>
    <meta name="description" content="Kelola pengumuman SIAKAD untuk semua pengguna, dosen, atau mahasiswa.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fs-4 mb-0">Kelola Pengumuman</h2>
            <button type="button" class="btn btn-primary" id="btn-add"><i class="bi bi-plus-circle me-2"></i>Buat Pengumuman</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>No</th><th>Judul</th><th>Target</th><th>Tanggal Publikasi</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="announcements-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="announcement-form" novalidate>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="formModalLabel">Form Pengumuman</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="id" id="a-id">
                            <div class="mb-3"><label for="a-judul" class="form-label">Judul</label><input type="text" class="form-control" id="a-judul" name="judul" maxlength="255" required></div>
                            <div class="mb-3"><label for="a-isi" class="form-label">Isi Pengumuman</label><textarea class="form-control" id="a-isi" name="isi" rows="5" required></textarea></div>
                            <div class="mb-3">
                                <label for="a-target" class="form-label">Tujukan Untuk</label>
                                <select class="form-select" id="a-target" name="target_role" required>
                                    <option value="semua">Semua</option>
                                    <option value="dosen">Dosen</option>
                                    <option value="mahasiswa">Mahasiswa</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary" id="announcement-submit">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body"><p class="mb-0">Yakin ingin menghapus pengumuman <strong id="delete-name"></strong>?</p></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-danger" id="delete-confirm">Ya, Hapus</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/announcements.js"></script>
</body>
</html>
