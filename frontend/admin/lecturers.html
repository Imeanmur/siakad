<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Dosen - SIAKAD</title>
    <meta name="description" content="Kelola data dosen SIAKAD: tambah, ubah, dan hapus dosen beserta akun loginnya.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fs-4 mb-0">Data Dosen</h2>
            <button type="button" class="btn btn-primary" id="btn-add"><i class="bi bi-plus-circle me-2"></i>Tambah Dosen</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>No</th><th>NIP</th><th>Nama Lengkap</th><th>Email</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="lecturers-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="lecturerModal" tabindex="-1" aria-labelledby="lecturerModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form id="lecturer-form" novalidate>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="lecturerModalLabel">Form Tambah Dosen</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="user_id" id="l-user-id">
                            <div class="mb-3"><label for="l-nama" class="form-label">Nama Lengkap</label><input type="text" class="form-control" id="l-nama" name="nama_lengkap" maxlength="100" required></div>
                            <div class="mb-3"><label for="l-nidn" class="form-label">NIP</label><input type="text" class="form-control" id="l-nidn" name="nidn" maxlength="20" required></div>
                            <div class="mb-3"><label for="l-email" class="form-label">Email</label><input type="email" class="form-control" id="l-email" name="email" maxlength="100" required></div>
                            <div class="mb-3">
                                <label for="l-password" class="form-label" id="l-password-label">Password</label>
                                <input type="password" class="form-control" id="l-password" name="password" autocomplete="new-password" minlength="8" maxlength="72">
                                <small class="form-text text-muted" id="l-password-hint">Minimal 8 karakter.</small>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary" id="lecturer-submit">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Konfirmasi Hapus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body"><p class="mb-0">Yakin ingin menghapus data dosen <strong id="delete-name"></strong>?</p></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-danger" id="delete-confirm">Ya, Hapus</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/lecturers.js"></script>
</body>
</html>
