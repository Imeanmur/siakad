<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - SIAKAD</title>
    <meta name="description" content="Masukkan kode OTP yang dikirimkan ke email terdaftar Anda untuk verifikasi login SIAKAD.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        #otp-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            background-size: 400% 400%;
            transition: background 1s ease-in-out;
            animation: gradient-animation 20s ease infinite;
        }
        .otp-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: fadeIn 0.8s ease-out forwards;
        }
        .theme-malam .otp-card {
            background: rgba(30, 30, 30, 0.85);
            color: #f1f1f1;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .otp-input-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .otp-input {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            border: 2px solid #ced4da;
            border-radius: 12px;
            transition: all 0.25s ease;
            background: #fff;
        }
        .otp-input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            transform: scale(1.08);
            outline: none;
        }
        .theme-malam .otp-input {
            background: #2b3035;
            border-color: #495057;
            color: #fff;
        }
        #countdown-timer {
            font-weight: 700;
            color: #0d6efd;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div id="otp-wrapper">
        <div class="otp-card p-4 p-md-5">
            <div class="text-center mb-3">
                <i class="fa-solid fa-shield-halved fa-3x text-primary mb-3"></i>
                <h1 class="fw-bold fs-3">VERIFIKASI AKUN ANDA</h1>
                <p class="text-muted small" id="otp-instruction">Masukkan 6 digit kode yang dikirim ke email Anda.</p>
            </div>

            <div id="message-container" class="text-center my-2"></div>

            <div class="text-center my-3 text-muted" id="timer-container">
                Kirim ulang dalam <span id="countdown-timer">01:00</span>
            </div>

            <form id="otpForm" novalidate>
                <div class="otp-input-container mb-4">
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required autocomplete="one-time-code">
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required>
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required>
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required>
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required>
                    <input type="text" class="form-control otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-login" id="verifyButton">
                        <span class="btn-text">Verifikasi</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="text-center mt-2 d-none" id="resend-container">
                Tidak menerima kode? 
                <button class="btn btn-link p-0 fw-semibold text-decoration-none" id="resend-btn">Kirim Ulang OTP</button>
            </div>

            <div class="text-center mt-3">
                <a href="login.html" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Kembali ke Halaman Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/verify-otp.js"></script>
</body>
</html>
