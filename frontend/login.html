<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD</title>
    <meta name="description" content="Login Sistem Informasi Akademik (SIAKAD) untuk mengakses dunia akademik Anda.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="login-wrapper">
        <div class="container">
            <div class="row min-vh-100 justify-content-center align-items-center">
                <div class="col-lg-10">
                    <div class="card login-card animate-fade-in">
                        <div class="row g-0">
                            <div class="col-md-6 d-none d-md-flex login-card-left">
                                <div class="greeting-box text-center">
                                    <i id="greeting-icon" class="fa-solid fa-sun fa-4x mb-4"></i>
                                    <h2 id="greeting-text" class="fw-bold">Selamat Datang</h2>
                                    <p id="greeting-desc" class="lead mt-2">Masuk untuk mengakses dunia akademik Anda.</p>
                                </div>
                            </div>
                            <div class="col-md-6 login-card-right">
                                <div class="login-form p-4 p-md-5">
                                    <div class="text-center mb-4">
                                        <h1 class="fw-bold fs-3">Login Akun</h1>
                                        <p class="text-muted">Gunakan akun terdaftar Anda.</p>
                                    </div>

                                    <div id="login-info" class="alert alert-info d-none" role="status"></div>
                                    <div id="login-error" class="alert alert-danger animate-shake d-none" role="alert">
                                        <i class="fas fa-exclamation-triangle me-2"></i><span id="login-error-text"></span>
                                    </div>

                                    <form id="loginForm" novalidate>
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="username" name="username" placeholder="Email atau NIM" autocomplete="username" required>
                                            <label for="username"><i class="fas fa-user me-2"></i>Email atau NIM</label>
                                        </div>
                                        <div class="input-group mb-4">
                                            <div class="form-floating">
                                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                                                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                                            </div>
                                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Tampilkan/sembunyikan password">
                                                <i class="fas fa-eye" id="toggleIcon"></i>
                                            </button>
                                        </div>
                                        <div class="d-grid">
                                            <button type="submit" class="btn btn-primary btn-login" id="loginButton">
                                                <span class="btn-text">Login</span>
                                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
