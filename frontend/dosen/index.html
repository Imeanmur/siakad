<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dosen - SIAKAD</title>
    <meta name="description" content="Dashboard dosen SIAKAD: ringkasan kelas yang diampu dan pengumuman akademik terbaru.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="alert alert-info shadow-sm mb-4">
            <h2 class="fs-5 mb-1" id="greeting-title">Selamat Datang di Dashboard Dosen!</h2>
            <p class="mb-0 small text-muted" id="dosen-info">Memuat data profil...</p>
        </div>

        <div class="row g-3 my-2">
            <div class="col-md-6">
                <div class="stat-card p-3 bg-white shadow-sm d-flex justify-content-around align-items-center rounded">
                    <div>
                        <h2 class="fs-2 mb-0" id="stat-classes">–</h2>
                        <p class="fs-5 text-muted mb-0">Kelas Diampu Semester Ini</p>
                    </div>
                    <i class="bi bi-person-video3 p-3 fs-1 text-primary"></i>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card p-3 bg-white shadow-sm d-flex justify-content-around align-items-center rounded">
                    <div>
                        <a href="input-nilai.html" class="btn btn-outline-primary btn-sm mb-1"><i class="bi bi-pencil-square me-1"></i>Input Nilai</a>
                        <br>
                        <a href="absensi.html" class="btn btn-outline-success btn-sm mt-1"><i class="bi bi-check-circle-fill me-1"></i>Kelola Absensi</a>
                    </div>
                    <i class="bi bi-journal-check p-3 fs-1 text-success"></i>
                </div>
            </div>
        </div>

        <div class="row my-4">
            <h2 class="fs-4 mb-3">Pengumuman Terbaru</h2>
            <div class="col" id="announcements"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/dosen-dashboard.js"></script>
</body>
</html>
