<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesi Pertemuan Kelas - SIAKAD</title>
    <meta name="description" content="Daftar sesi pertemuan perkuliahan dan pembuatan pertemuan baru.">
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
    <div id="page-loader"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div></div>

    <main id="page-main" class="d-none">
        <div id="alert-area"></div>

        <div class="mb-3">
            <a href="absensi.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Daftar Kelas
            </a>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <span class="badge bg-success fs-6 px-3 py-1 mb-1" id="class-code">-</span>
                        <h2 class="fs-4 fw-bold text-dark mb-1" id="class-name">Memuat informasi kelas...</h2>
                        <p class="text-muted small mb-0">Kelola daftar pertemuan dan absensi mahasiswa kelas ini.</p>
                    </div>
                    <button type="button" class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#addSessionModal">
                        <i class="bi bi-plus-lg me-1"></i> Tambah Pertemuan Baru
                    </button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                <h3 class="fs-5 fw-bold mb-0">Daftar Sesi Pertemuan</h3>
                <span class="badge bg-secondary-subtle text-secondary" id="session-count">0 Pertemuan</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 140px;">Sesi</th>
                                <th>Materi / Judul Pertemuan</th>
                                <th style="width: 180px;">Tanggal</th>
                                <th style="width: 180px;" class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="session-tbody">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">Memuat data pertemuan...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal Tambah Pertemuan -->
        <div class="modal fade" id="addSessionModal" tabindex="-1" aria-labelledby="addSessionModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="addSessionModalLabel">Tambah Sesi Pertemuan Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="addSessionForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="pertemuan_ke" class="form-label fw-semibold">Pertemuan Ke-</label>
                                <input type="number" id="pertemuan_ke" class="form-control" min="1" max="32" required>
                            </div>
                            <div class="mb-3">
                                <label for="judul_pertemuan" class="form-label fw-semibold">Judul / Materi Pertemuan</label>
                                <input type="text" id="judul_pertemuan" class="form-control" placeholder="Contoh: Pengenalan Algoritma & Struktur Data" required>
                            </div>
                            <div class="mb-3">
                                <label for="tanggal_pertemuan" class="form-label fw-semibold">Tanggal Pertemuan</label>
                                <input type="date" id="tanggal_pertemuan" class="form-control" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary" id="btn-save-session">Simpan Pertemuan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/dosen-kelola-absensi.js"></script>
</body>
</html>
